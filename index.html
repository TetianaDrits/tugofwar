<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Base Tug of War</title>
<style>
  body { background: #0b111e; color: #fff; font-family: sans-serif; text-align: center; }
  #track { width: 400px; height: 30px; background: #222; border: 2px solid #fff; margin: 20px auto; position: relative; border-radius: 15px; overflow: hidden; }
  #flag { width: 20px; height: 30px; background: #00D395; position: absolute; left: 190px; transition: left 0.1s; }
  button { padding: 15px 30px; font-size: 18px; background: #0052FF; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<h1>Base vs High Fees</h1>
<p>Быстро кликай, чтобы перетянуть пользователей на Base!</p>
<div id="track"><div id="flag"></div></div>
<button onclick="pull()">ПЕРЕТЯНУТЬ (CLICK!)</button>
<script>
  let pos = 190;
  function pull() { pos -= 8; }
  setInterval(() => {
    pos += 3; // Противник тянет назад
    if(pos < 0) { alert('ПОБЕДА BASE! Все транзакции перешли к нам!'); pos = 190; }
    if(pos > 380) { alert('ПРОИГРЫШ! Комиссии победили.'); pos = 190; }
    document.getElementById('flag').style.left = pos + 'px';
  }, 50);
</script>
</body>
</html>
